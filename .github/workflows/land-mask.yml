name: Maschera terra

on:
  workflow_dispatch:   # si lancia a mano, una volta sola

permissions:
  contents: write

jobs:
  mask:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Crea la maschera terra/mare
        run: python scripts/make_land_mask.py
      - name: Salva nel repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add waves-land.json
          if ! git diff --cached --quiet; then
            git commit -m "Maschera terra"
            git pull --rebase
            git push
          fi
