name: Griglia onde

on:
  schedule:
    - cron: '20 */6 * * *'   # ogni 6 ore: i modelli onde si aggiornano 2 volte al giorno
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wave-grid
  cancel-in-progress: false

jobs:
  grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scarica la griglia da Open-Meteo
        run: python scripts/fetch_wave_grid.py
      - name: Salva nel repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add waves-grid.json
          if ! git diff --cached --quiet; then
            git commit -m "Griglia onde"
            git pull --rebase
            git push
          fi
