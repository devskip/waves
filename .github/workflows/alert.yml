name: Alert onde

on:
  schedule:
    - cron: "15 * * * *"     # ogni ora (orario UTC), può partire con qualche minuto di ritardo
  workflow_dispatch:          # permette di lanciarlo a mano dalla scheda Actions

permissions:
  contents: write             # serve per salvare alert_state.json nel repository

concurrency:
  group: alert-onde
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Controlla le previsioni e invia gli alert
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SURF_THRESHOLD: ${{ vars.SURF_THRESHOLD }}
          DEVICE_SPOT: ${{ vars.DEVICE_SPOT }}
        run: python alert_telegram.py

      - name: Invia le notifiche push (blocca schermo e icona dell'app)
        continue-on-error: true   # se le push hanno un problema, Telegram e il resto non si fermano
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          pip install --quiet pywebpush
          python alert_push.py

      - name: Salva stato alert e device.json
        run: |
          if [ -n "$(git status --porcelain alert_state.json device.json)" ]; then
            git config user.name "onde-bot"
            git config user.email "onde-bot@users.noreply.github.com"
            git add alert_state.json device.json
            git commit -m "Aggiorna stato alert e device"
            git pull --rebase
            git push
          fi
